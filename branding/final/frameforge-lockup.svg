<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 256" xmlns="http://www.w3.org/2000/svg">
  <!-- FrameForge Horizontal Lockup -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E11D48;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BE123C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Symbol (left side) -->
  <g transform="translate(0, 0)">
    <!-- Main F -->
    <path d="M 76 76 L 76 180 M 76 76 L 164 76 M 76 124 L 148 124" 
          fill="none" stroke="url(#logoGradient)" stroke-width="28" 
          stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Speed trails -->
    <g opacity="0.7">
      <path d="M 40 84 L 68 84" stroke="url(#logoGradient)" stroke-width="8" stroke-linecap="round"/>
      <path d="M 32 100 L 68 100" stroke="url(#logoGradient)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
      <path d="M 24 116 L 68 116" stroke="url(#logoGradient)" stroke-width="8" stroke-linecap="round"/>
      <path d="M 32 132 L 68 132" stroke="url(#logoGradient)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
      <path d="M 40 148 L 68 148" stroke="url(#logoGradient)" stroke-width="8" stroke-linecap="round"/>
      <path d="M 48 164 L 68 164" stroke="url(#logoGradient)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    </g>
    
    <!-- Frame corners -->
    <path d="M 164 68 L 184 68 L 184 88" fill="none" stroke="url(#logoGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 184 116 L 184 136 L 164 136" fill="none" stroke="url(#logoGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 164 76 Q 212 76, 212 124" fill="none" stroke="url(#logoGradient)" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- Wordmark (right side) - Poppins style, constructed as paths -->
  <g transform="translate(240, 128)" fill="#F8FAFC">
    <!-- FRAME -->
    <text x="0" y="0" font-family="Poppins, sans-serif" font-size="72" font-weight="700" fill="#F8FAFC" letter-spacing="-2">
      Frame<tspan fill="#E11D48">Forge</tspan>
    </text>
  </g>
</svg>
