<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- FrameForge Final Symbol - Play Red with Cinema Dark accent -->
  <g id="frameforge-symbol">
    <!-- Main F - bold, round caps for friendliness -->
    <path d="M 84 76 L 84 180 M 84 76 L 172 76 M 84 124 L 156 124" 
          fill="none" stroke="#F84768" stroke-width="28" 
          stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Speed trails (suggesting optimization/performance) -->
    <g opacity="0.75">
      <line x1="44" y1="84" x2="76" y2="84" stroke="#F84768" stroke-width="8" stroke-linecap="round"/>
      <line x1="36" y1="100" x2="76" y2="100" stroke="#F84768" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
      <line x1="28" y1="116" x2="76" y2="116" stroke="#F84768" stroke-width="8" stroke-linecap="round"/>
      <line x1="36" y1="132" x2="76" y2="132" stroke="#F84768" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
      <line x1="44" y1="148" x2="76" y2="148" stroke="#F84768" stroke-width="8" stroke-linecap="round"/>
      <line x1="52" y1="164" x2="76" y2="164" stroke="#F84768" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
    </g>
    
    <!-- Frame corner accent (top right) - suggesting video frame -->
    <path d="M 172 68 L 192 68 L 192 88" 
          fill="none" stroke="#1E1B4B" stroke-width="8" 
          stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Frame corner accent (bottom) -->
    <path d="M 192 116 L 192 136 L 172 136" 
          fill="none" stroke="#1E1B4B" stroke-width="8" 
          stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Velocity curve (optional accent) -->
    <path d="M 172 76 Q 212 76, 212 124" 
          fill="none" stroke="#1E1B4B" stroke-width="9" 
          stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
