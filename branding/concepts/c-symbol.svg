<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Concept C: Speed/motion monoline F -->
  <g id="concept-c">
    <!-- Main F with speed effect -->
    <path d="M 88 80 L 88 176 M 88 80 L 168 80 M 88 128 L 152 128" 
          fill="none" stroke="#000" stroke-width="24" 
          stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Speed trails (left side) -->
    <line x1="40" y1="88" x2="80" y2="88" stroke="#000" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="32" y1="104" x2="80" y2="104" stroke="#000" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <line x1="24" y1="120" x2="80" y2="120" stroke="#000" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="32" y1="136" x2="80" y2="136" stroke="#000" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <line x1="40" y1="152" x2="80" y2="152" stroke="#000" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="48" y1="168" x2="80" y2="168" stroke="#000" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Velocity arc -->
    <path d="M 168 80 Q 208 80, 208 128" 
          fill="none" stroke="#000" stroke-width="10" 
          stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
